[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-zoo"
version = "0.1.0"
description = "NEXUS State Vector + FSM agents prototype (NexusZoo)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "NexusZoo Contributors"}
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
nexus-zoo-demo = "examples.demo:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
